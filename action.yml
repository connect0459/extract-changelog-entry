name: 'Extract Changelog Entry'
description: >-
  Extracts a version's section from a Keep a Changelog file and appends a
  Full Changelog link for GitHub Release notes.
author: 'connect0459'

branding:
  icon: 'file-text'
  color: 'white'

inputs:
  ref-name:
    description: >-
      Git ref name of the release tag (e.g. "v1.2.3" or "1.2.3"). A leading
      "v" is stripped when matching the CHANGELOG.md version heading.
    required: true
  changelog-path:
    description: 'Path to the CHANGELOG.md file.'
    required: false
    default: 'CHANGELOG.md'
  output-path:
    description: 'Path to write the extracted release notes to.'
    required: false
    default: 'release-notes.md'
  promote-headings:
    description: >-
      Whether to promote entry headings so the shallowest one present
      becomes an H2, preserving every other heading's depth relative to it.
      Set to 'false' to keep the CHANGELOG.md's original heading levels
      as-is.
    required: false
    default: 'true'

outputs:
  release-notes-path:
    description: 'Path to the generated release notes file (same as output-path).'
    value: ${{ steps.extract.outputs.release-notes-path }}
  version:
    description: 'The release version with any leading "v" stripped.'
    value: ${{ steps.extract.outputs.version }}

runs:
  using: 'composite'
  steps:
    - id: extract
      shell: bash
      env:
        REF_NAME: ${{ inputs.ref-name }}
        CHANGELOG_PATH: ${{ inputs.changelog-path }}
        OUTPUT_PATH: ${{ inputs.output-path }}
        PROMOTE_HEADINGS: ${{ inputs.promote-headings }}
      run: |
        set -euo pipefail

        RELEASE_VERSION="${REF_NAME#v}"

        # A "## [" heading or "---" divider inside a fenced code block is
        # literal text, not a real boundary; skip boundary checks while
        # inside a fence. An unclosed fence swallows the rest of the file.
        awk -v ver="$RELEASE_VERSION" '
          function stripindent(s,   n) {
            n = 0
            while (n < 3 && substr(s, n + 1, 1) == " ") n++
            return substr(s, n + 1)
          }
          function fence_len(s,   t, ch, n) {
            t = stripindent(s)
            ch = substr(t, 1, 1)
            if (ch != "`" && ch != "~") return 0
            n = 0
            while (substr(t, n + 1, 1) == ch) n++
            if (n < 3) return 0
            return n
          }
          function fence_char(s,   t) {
            t = stripindent(s)
            return substr(t, 1, 1)
          }
          function fence_rest_blank(s, len,   t) {
            t = stripindent(s)
            return (substr(t, len + 1) ~ /^[ \t]*$/)
          }
          {
            len = fence_len($0)
            if (in_fence) {
              if (len >= fence_min_len && fence_char($0) == fence_ch && fence_rest_blank($0, len)) {
                in_fence = 0
              }
            } else if (len > 0) {
              in_fence = 1
              fence_ch = fence_char($0)
              fence_min_len = len
            } else if ($0 ~ /^## \[/) {
              if (capture) exit
              if (index($0, "## [" ver "]") == 1) { capture = 1; next }
            } else if ($0 ~ /^---/) {
              if (capture) exit
            }
            if (capture) print
          }
        ' "$CHANGELOG_PATH" > "$OUTPUT_PATH"

        # Drop leading blank lines (the gap between the version heading and
        # its first entry subsection) and trailing blank lines (so
        # appending the Full Changelog link below doesn't leave two blank
        # lines before it).
        awk '{a[NR]=$0} END {
          s=1; e=NR
          while (s<=e && a[s] ~ /^[[:space:]]*$/) s++
          while (e>=s && a[e] ~ /^[[:space:]]*$/) e--
          for (i=s;i<=e;i++) print a[i]
        }' "$OUTPUT_PATH" > "$OUTPUT_PATH.tmp"
        mv "$OUTPUT_PATH.tmp" "$OUTPUT_PATH"

        # Keep a Changelog nests each entry's subsections one level deeper
        # (###, ####, ...) than the version heading (##) this extraction
        # strips out. An entry body can also embed its own headings shallower
        # than that convention (e.g. a "##" inside a list item's continuation
        # text); shifting every heading by a fixed +1 would flatten those
        # relative to the subsections. Instead, find the shallowest heading
        # actually present in the body and shift every heading by the delta
        # that normalizes it to "##", preserving relative depth throughout.
        if [ "$PROMOTE_HEADINGS" = "true" ]; then
          awk '
            function stripindent(s,   n) {
              n = 0
              while (n < 3 && substr(s, n + 1, 1) == " ") n++
              return substr(s, n + 1)
            }
            function fence_len(s,   t, ch, n) {
              t = stripindent(s)
              ch = substr(t, 1, 1)
              if (ch != "`" && ch != "~") return 0
              n = 0
              while (substr(t, n + 1, 1) == ch) n++
              if (n < 3) return 0
              return n
            }
            function fence_char(s,   t) {
              t = stripindent(s)
              return substr(t, 1, 1)
            }
            function fence_rest_blank(s, len,   t) {
              t = stripindent(s)
              return (substr(t, len + 1) ~ /^[ \t]*$/)
            }
            function heading_hashes(s,   n) {
              n = 0
              while (substr(s, n + 1, 1) == "#") n++
              return n
            }
            {
              lines[NR] = $0
              len = fence_len($0)
              if (in_fence) {
                if (len >= fence_min_len && fence_char($0) == fence_ch && fence_rest_blank($0, len)) {
                  in_fence = 0
                }
                next
              } else if (len > 0) {
                in_fence = 1
                fence_ch = fence_char($0)
                fence_min_len = len
                next
              }
              n = heading_hashes($0)
              if (n > 0 && substr($0, n + 1, 1) == " ") {
                heading_level[NR] = n
                if (min_level == 0 || n < min_level) min_level = n
              }
            }
            END {
              delta = 0
              if (min_level > 0) delta = min_level - 2
              for (i = 1; i <= NR; i++) {
                line = lines[i]
                if (heading_level[i] > 0) {
                  new_level = heading_level[i] - delta
                  if (new_level < 1) new_level = 1
                  hashes = ""
                  for (j = 0; j < new_level; j++) hashes = hashes "#"
                  sub(/^#+/, hashes, line)
                }
                print line
              }
            }
          ' "$OUTPUT_PATH" > "$OUTPUT_PATH.tmp"
          mv "$OUTPUT_PATH.tmp" "$OUTPUT_PATH"
        fi

        if [ ! -s "$OUTPUT_PATH" ]; then
          echo "::error::No CHANGELOG.md section found for [$RELEASE_VERSION]. Retitle [Unreleased] to [$RELEASE_VERSION] - YYYY-MM-DD before tagging."
          exit 1
        fi

        # Append a Full Changelog section, reusing the compare URL that
        # CHANGELOG.md's own reference-link section already records for
        # this version. The very first release's reference link points at
        # the tag itself rather than a compare view, so link the tag name
        # to its commit history instead.
        COMPARE_URL="$(awk -v ver="$RELEASE_VERSION" '
          index($0, "[" ver "]: ") == 1 {
            sub(/^\[[^]]*\]: </, "")
            sub(/>$/, "")
            print
            exit
          }
        ' "$CHANGELOG_PATH")"

        FULL_CHANGELOG_LABEL=""
        FULL_CHANGELOG_URL=""
        if [[ "$COMPARE_URL" == *"/compare/"* ]]; then
          FULL_CHANGELOG_LABEL="${COMPARE_URL##*/}"
          FULL_CHANGELOG_URL="$COMPARE_URL"
        elif [ -n "$COMPARE_URL" ]; then
          FULL_CHANGELOG_LABEL="$REF_NAME"
          FULL_CHANGELOG_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commits/$REF_NAME"
        fi

        if [ -n "$FULL_CHANGELOG_URL" ]; then
          printf '\n---\n\n## Full Changelog\n\n[%s](%s)\n' \
            "$FULL_CHANGELOG_LABEL" "$FULL_CHANGELOG_URL" >> "$OUTPUT_PATH"
        fi

        echo "release-notes-path=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"
        echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
