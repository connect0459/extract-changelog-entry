name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

run-name: CI on ${{ github.head_ref || github.ref_name }}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      fixture: ${{ steps.filter.outputs.fixture }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            fixture:
              - '.github/workflows/ci.yml'
              - 'tests/fixtures/**'
              - 'action.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  fixture:
    needs: changes
    if: needs.changes.outputs.fixture == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - standard
          - first-release
          - trailing-blank-lines
          - version-not-found
          - no-reference-link
          - promote-headings-disabled
          - promote-headings-code-fence
          - deep-heading-promotion
          - nested-section-headings
          - code-fence-boundary-marker
          - unclosed-code-fence
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Read fixture inputs
        id: fixture
        run: |
          echo "ref-name=$(cat "tests/fixtures/${{ matrix.fixture }}/ref-name")" >> "$GITHUB_OUTPUT"

          PROMOTE_HEADINGS_FILE="tests/fixtures/${{ matrix.fixture }}/promote-headings"
          if [ -f "$PROMOTE_HEADINGS_FILE" ]; then
            echo "promote-headings=$(cat "$PROMOTE_HEADINGS_FILE")" >> "$GITHUB_OUTPUT"
          else
            echo "promote-headings=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run action against fixture
        id: run-action
        continue-on-error: true
        uses: ./
        with:
          ref-name: ${{ steps.fixture.outputs.ref-name }}
          changelog-path: tests/fixtures/${{ matrix.fixture }}/CHANGELOG.md
          output-path: ${{ runner.temp }}/release-notes.md
          promote-headings: ${{ steps.fixture.outputs.promote-headings }}

      - name: Verify outcome matches fixture contract
        run: |
          set -euo pipefail
          FIXTURE_DIR="tests/fixtures/${{ matrix.fixture }}"
          EXPECTED_FILE="$FIXTURE_DIR/expected.md"
          OUTCOME="${{ steps.run-action.outcome }}"

          # A fixture with an expected.md must succeed and produce matching
          # output; a fixture without one documents an expected failure.
          if [ -f "$EXPECTED_FILE" ]; then
            if [ "$OUTCOME" != "success" ]; then
              echo "::error::expected the action to succeed for fixture '${{ matrix.fixture }}', but it failed"
              exit 1
            fi
            diff "$EXPECTED_FILE" "${{ runner.temp }}/release-notes.md"
          else
            if [ "$OUTCOME" == "success" ]; then
              echo "::error::expected the action to fail for fixture '${{ matrix.fixture }}', but it succeeded"
              exit 1
            fi
          fi

      - name: Verify step outputs
        if: steps.run-action.outcome == 'success'
        run: |
          set -euo pipefail
          RAW_REF="${{ steps.fixture.outputs.ref-name }}"
          EXPECTED_VERSION="${RAW_REF#v}"
          ACTUAL_VERSION="${{ steps.run-action.outputs.version }}"
          ACTUAL_PATH="${{ steps.run-action.outputs.release-notes-path }}"

          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::version output mismatch: expected '$EXPECTED_VERSION', got '$ACTUAL_VERSION'"
            exit 1
          fi
          if [ "$ACTUAL_PATH" != "${{ runner.temp }}/release-notes.md" ]; then
            echo "::error::release-notes-path output mismatch: got '$ACTUAL_PATH'"
            exit 1
          fi

  # A stable required-status-check name for branch protection. The fixture
  # matrix's own check names are per-leg (e.g. "fixture (standard)") and
  # shift whenever a fixture is added or removed; branch protection targets
  # this job instead, so its required-check list never needs to change.
  # It also treats a skipped fixture matrix (no fixture-relevant files
  # changed, per the `changes` job) as passing, not just a green one.
  # A future, differently-shaped job joins the `needs:` list here rather
  # than becoming a second required check.
  gate:
    if: always()
    needs: [changes, lint, fixture]
    runs-on: ubuntu-latest
    steps:
      - name: Require lint and the fixture matrix to have succeeded
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::changed-files detection did not succeed"
            exit 1
          fi

          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::lint did not succeed"
            exit 1
          fi

          FIXTURE_RESULT="${{ needs.fixture.result }}"
          if [ "$FIXTURE_RESULT" != "success" ] && [ "$FIXTURE_RESULT" != "skipped" ]; then
            echo "::error::fixture matrix did not succeed"
            exit 1
          fi
