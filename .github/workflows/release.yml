name: Release

on:
  push:
    tags:
      - "v*.*.*"

run-name: Release ${{ github.ref_name }}

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Depending on a past tagged version to extract this project's own
      # release notes would leave a future release unable to fix a
      # regression in the extraction logic itself. Uses the working tree's
      # own action.yml instead.
      - name: Extract changelog section for this version
        id: changelog
        uses: ./
        with:
          ref-name: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.release-notes-path }}
